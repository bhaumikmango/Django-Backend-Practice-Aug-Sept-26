<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}My Application{% endblock %}</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { display: flex; height: 100vh; background-color: #f8fafc; }
        
        /* Left Branding Bar */
        aside { width: 250px; background-color: #1e293b; color: white; padding: 20px; display: flex; flex-direction: column; z-index: 10; }
        .brand-title { font-size: 20px; font-weight: bold; margin-bottom: 30px; letter-spacing: 0.5px; }
        .sidebar-links { display: flex; flex-direction: column; gap: 10px; }
        .sidebar-links a { color: #cbd5e1; text-decoration: none; padding: 10px; border-radius: 6px; font-size: 14px; transition: 0.2s; }
        .sidebar-links a:hover { background-color: #334155; color: white; }

        /* Main Workspace Wrapper */
        .workspace { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

        /* Top Navigation Bar */
        nav { height: 60px; background-color: white; border-bottom: 1px solid #e2e8f0; display: flex; align-items: center; justify-content: space-between; padding: 0 30px; z-index: 9; }
        .nav-links { display: flex; gap: 20px; align-items: center; }
        .nav-links a { text-decoration: none; color: #64748b; font-size: 14px; }
        .nav-links a:hover { color: #0f172a; }

        /* Dynamic Content Panel */
        main { flex: 1; padding: 30px; overflow-y: auto; }
    </style>
</head>
<body>

    <!-- Left Side Branding Bar -->
    <aside>
        <div class="brand-title">Core App</div>
        <div class="sidebar-links">
            <a href="{% url 'home' %}">Dashboard Home</a>
            <a href="{% url 'success-page' %}">Success Screen</a>
            <a href="{% url 'contact' %}">Contact Page</a>

        </div>
    </aside>

    <!-- Right Workspace Area -->
    <div class="workspace">
        <!-- Top Navigation Bar -->
        <nav>
            <div class="search-placeholder">
                <span style="color: #94a3b8; font-size: 14px;">Global System View</span>
            </div>
            <div class="nav-links">
                <a href="#">Documentation</a>
                <a href="#">Support</a>
                <div style="width: 32px; height: 32px; background-color: #cbd5e1; border-radius: 50%;"></div>
            </div>
        </nav>

        <!-- Dynamic Page Injector -->
        <main>
            {% block content %}
            <!-- Extended templates populate content here -->
            {% endblock %}
        </main>
    </div>

</body>
</html>
